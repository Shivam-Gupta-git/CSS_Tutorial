<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>in and out</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: yellow;
        }
        #navbar{
            height: 80px;
            width: 100%;
            background-color: aquamarine;
            position: sticky;
            top: 0;
        }
        #main-box{
           display: flex;
           flex-wrap: wrap;
           gap: 10px;
        }
        .sidebar{
           height: 600px;
           width: 200px;
           border: 1px solid gray;
           position: absolute;
           user-select: none;
           background-color: aqua;
        }
        #check{
            display: none;
        }
       
        #check:checked ~ label #btn{

    opacity: 0;
    pointer-events: none;
}


        .box2{
           height: 600px;
           width: 400px;
           border: 1px solid gray;
        }
    </style>
</head>
<body>
    <nav id="navbar"></nav>
    <input type="checkbox" id="check">
    <label for="check">
      <i class="fas fa-bars" id="btn"></i>
      <i class="fas fa-times" id="cancel"></i>
    </label>
    <header id="main-box">
        <div class="sidebar">
        </div>
        <div class="box2"></div>
        <div class="box"></div>
        <div class="box"></div>
    </header>
</body>
</html>
