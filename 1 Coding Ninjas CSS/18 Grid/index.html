<!DOCTYPE html>

        <div class="grid-template-rows-section-4-container-1"></div>

      <!-- gaps -->
      <div>gaps</div>
      <section class="gaps-section-5">
        <div class="gaps-section-5-container-1"></div>
        <div class="gaps-section-5-container-1"></div>

        <div class="gaps-section-5-container-1"></div>

      <!-- justify-items and align-items -->
      <div>justify-items and align-items</div>
      <section class="justify-items-and-align-items-section-6">
        <div class="justify-items-and-align-items-section-6-container-1">box1</div>
        <div class="justify-items-and-align-items-section-6-container-1">box2</div>
        <div class="justify-items-and-align-items-section-6-container-1">box3</div>
        <div class="justify-items-and-align-items-section-6-container-1">box4</div>
