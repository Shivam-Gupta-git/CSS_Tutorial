<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- Grid -->
    <header class="header">
      <h2 class="header-subHeading-1">Grid</h2>
    </header>
    <main>
      <section class="grid-section-1">
        <div class="grid-section-1-container-1">1</div>
        <div class="grid-section-1-container-1">2</div>
        <div class="grid-section-1-container-1">3</div>
        <div class="grid-section-1-container-1">4</div>
        <div class="grid-section-1-container-1">5</div>
        <div class="grid-section-1-container-1">6</div>
      </section>

      <!-- grid-template-columns -->
      <div>grid-template-columns</div>
      <section class="grid-section-2">
        <div class="grid-section-2-container-1">1</div>
        <div class="grid-section-2-container-1">2</div>
        <div class="grid-section-2-container-1">3</div>
        <div class="grid-section-2-container-1">4</div>
        <div class="grid-section-2-container-1">5</div>
        <div class="grid-section-2-container-1">6</div>
      </section>

      <!--  repeat() -->
      <div>repeat()</div>
      <section class="repeat-section-3">
        <div class="repeat-section-3-container-1">1</div>
        <div class="repeat-section-3-container-1">1</div>
        <div class="repeat-section-3-container-1">1</div>
        <div class="repeat-section-3-container-1">1</div>
        <div class="repeat-section-3-container-1">1</div>
        <div class="repeat-section-3-container-1">1</div>
      </section>

      <!-- grid-template-rows -->
      <div>grid-template-rows</div>
      <section class="grid-template-rows-section-4">
        <div class="grid-template-rows-section-4-container-1"></div>
        <div class="grid-template-rows-section-4-container-1"></div>
        <div class="grid-template-rows-section-4-container-1"></div>
        <div class="grid-template-rows-section-4-container-1"></div>
        <div class="grid-template-rows-section-4-container-1"></div>
        <div class="grid-template-rows-section-4-container-1"></div>
      </section>

      <!-- gaps -->
      <div>gaps</div>
      <section class="gaps-section-5">
        <div class="gaps-section-5-container-1"></div>
        <div class="gaps-section-5-container-1"></div>
        <div class="gaps-section-5-container-1"></div>
        <div class="gaps-section-5-container-1"></div>
        <div class="gaps-section-5-container-1"></div>
        <div class="gaps-section-5-container-1"></div>

      </section>
    </main>
  </body>
</html>
