<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Colors | Fundamental of CSS</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="header">
    <h2 class="header-subHeading-1">CSS Colors</h2>
  </header>
  <main>
    <h1>CSS Colors</h1>

    <p class="hexExample">This text uses a HEX color.</p>

    <p class="rgbExample">This text uses an RGB color.</p>

    <p class="hslExample">This text uses an HSL color.</p>

    <div class="backgroundExample">
        This element has a light-blue background.
    </div>
    <br>

    <div class="transparentExample">
        This element has a semi-transparent red background.
    </div>
    <div>
      <h1 style="color: rgb(0, 0, 225); text-shadow: 2px 2px 5px #008000;">hello</h1>
    </div>
  </main>
</body>
</html>
