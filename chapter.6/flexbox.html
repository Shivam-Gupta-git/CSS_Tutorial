<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
         /* flex direction Property */
        .container{
         display: flex;
         flex-direction: row-reverse;
        }
        .box1{
            height: 232px;
            width: 231px;
            background-color: aquamarine;
            border: 2px solid gray;
        }
        .box2{
            height: 232px;
            width: 231px;
            background-color: antiquewhite;
            border: 2px solid gray;
        }


        /* flex wrap Property */
        .count{
         display: flex;
         flex-direction: row-reverse;
          flex-wrap: wrap-reverse; 
        }
        .box3{
            height: 232px;
            width: 231px;
            background-color: rgb(0, 217, 145);
            border: 2px solid gray;
        }
        .box4{
            height: 232px;
            width: 231px;
            background-color: antiquewhite;
            border: 2px solid gray;
        }


        /* Justify content(vertically) Property, align-items Property(horizantally) */
        .coun{
     display: flex;
          background-color: aqua;
         height: 543px;
         width: 100%;
         align-items: center;
         justify-content: center;
        }
        .box5{
            height: 232px;
            width: 231px;
            background-color: rgb(0, 217, 145);
            border: 2px solid gray;
        }
        .box6{
            height: 232px;
            width: 231px;
            background-color: antiquewhite;
            border: 2px solid gray;
        }
       
        
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box2">box3</div>
        <div class="box2">box4</div>
        <div class="box2">box5</div>
    </div><hr>
    <div class="count">
        <div class="box3">box1</div>
        <div class="box4">box2</div>
        <div class="box4">box3</div>
        <div class="box4">box4</div>
        <div class="box4">box5</div>
    </div><hr>
   <div class="coun">
    <div class="box5">box1</div>
    <div class="box6">box2</div>
    <div class="box6">box3</div>
    <div class="box6">box4</div> 
    <div class="box6">box5</div>
   </div>
   
</body>
</html>
