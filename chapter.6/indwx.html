<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float</title>
    <style>

        /* 1.  float property */
        .box1{
            height: 223px;
            width: 223px;
            background-color: aquamarine;
            float: right;
        }
        .box2{
            height: 223px;
            width: 223px;
            background-color: rgb(211, 229, 14);
         float: right; 
         clear: right;
        }
    </style>
</head>
<body>
    <div class="box1">box.1</div>
    <div class="box2">box.2</div>
</body>
</html>
