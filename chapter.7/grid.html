<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Grei</title>
    <style>
        .container{
            display: grid;
            background-color: yellow;
            grid-column-gap: 9px;
          grid-template-columns: 122px 122px 122px 122px;
          grid-template-rows: 121px;
        }
        .item{
            background-color: aqua;
            border: 2px solid red;
        }
        .conta{
            display: grid;
            background-color: yellow;
            grid-row-gap: 9px;
            grid-template-rows: 122px 122px 122px 122px;
        }
        .main{
            background-color: aqua;
            border: 2px solid red;
        }
    .cont{
        display: grid;
            background-color: yellow;
             grid-column-gap:9px;
             grid-template-columns: 200px auto
             auto auto auto auto auto auto auto auto;
          grid-template-rows: 151px;
            
          
        
          }
          
     .ma{
        background-color: aquamarine;
        border: 2px solid red;
     }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div><br>
     <div class="conta">
        <div class="main">1</div>
        <div class="main">2</div>
        <div class="main">3</div>
        <div class="main">4</div>
     </div><br>
     <div class="cont">
        <div class="ma">1</div>
        <div class="ma">2</div>
        <div class="ma">3</div>
        <div class="ma">4</div>
        <div class="ma">5</div>
        <div class="ma">6</div>
        <div class="ma">7</div>
        <div class="ma">8</div>
        <div class="ma">9</div>
     </div><br>
</body>
</html>
