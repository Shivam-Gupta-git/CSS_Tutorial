<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin collapse</title>
    <style>
*{
    margin: 0;
    padding: 0;
}
.box1{
    background-color: brown;
    margin: 30px;
    height: 350px;
    width: 233px;
    border: 2px solid black
    ;
}
.box2{
    background-color: aquamarine;
    /* margin: 20px; */
    height: 20px;
    width: 100%;
    padding: 6px;
    border: 5px solid gray;
    box-sizing: border-box;
    
}
    </style>
</head>
<body>
    <div class="box1">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Magni ipsum nostrum atque dolores accusamus quos iure odio. Quae sunt amet nemo cumque!</div>

    <div class="box2"></div>
</body>
</html>
